name: API validation

on:
  # A bare push keeps every branch and every tag, as the previous `on: [push]`
  # did. Restricting it to branches would drop tag pushes
  push:
  pull_request:

env:
  FORCE_COLOR: 2

permissions:
  contents: read

jobs:
  openapi-validator:
    name: Node
    # A branch in this repository is covered by its push event. A pull request
    # from a fork pushes nowhere we see, so it is covered by the pull_request
    # event instead - the same split build.yml uses, and it keeps either kind
    # of change from being validated twice
    if: |
      github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test
