openapi: 3.0.2
components:
  schemas:
    took:
      type: object
      properties:
        took:
          type: number
          description: Time in seconds it took to process the request
          example: 0.003
    success:
      type: object
      properties:
        status:
          type: string
          description: Key indicating the status of the request
          example: "success"
  errors:
    bad_request:
      type: object
      description: Bad request
      properties:
        error:
          type: object
          properties:
            key:
              type: string
              description: "Machine-readable error type"
            message:
              type: string
              description: "Human-readable error message"
            hint:
              type: string
              description: "Further details"
              nullable: true
    unauthorized:
      type: object
      description: Authentication required
      properties:
        error:
          type: object
          properties:
            key:
              type: string
              description: "Machine-readable error type"
              example: "unauthorized"
            message:
              type: string
              description: "Human-readable error message"
              example: "Unauthorized"
            hint:
              type: string
              nullable: true
              description: "No additional data available"
              example: null
    too_many_requests:
      type: object
      description: "Too many requests (rate limiting)"
      properties:
        error:
          type: object
          properties:
            key:
              type: string
              description: "Machine-readable error type"
              example: "too_many_requests"
            message:
              type: string
              description: "Human-readable error message"
              example: "Too many requests"
            hint:
              type: string
              nullable: true
              description: "No additional data available"
              example: null
  headers:
    Location:
      description: Location of created resource
      schema:
        type: string

  parameters:
    database:
      from:
        in: query
        description: Unix timestamp from when the data should be requested
        name: from
        schema:
          type: integer
        required: true
        example: 1672580025
      until:
        in: query
        description: Unix timestamp from when the data should be requested
        name: until
        schema:
          type: integer
        required: true
        example: 1672666425
      blocked:
        in: query
        description: Should this query return only blocked queries?
        schema:
          type: boolean
        required: false
        example: false
    item:
      in: query
      name: item
      description: |
        The item to operate on, as an alternative to naming it in the URI path.

        Browsers remove a path segment that is `.` or `..` - as well as their percent-encoded forms `%2e` and `%2e%2e` - while they resolve a URL, so an item with such a name can never reach Pi-hole as part of the path. A query parameter is not subject to this normalization, e.g., `PUT /api/groups?item=.`

        The value is used whenever the URI path carries no item. Both may be given at the same time as long as they are identical: the path is what identifies the resource, so a disagreement is rejected with `400` instead of being silently resolved in favor of either one.
      schema:
        type: string
      required: false
      example: "."
    item_required:
      in: query
      name: item
      description: |
        The item to operate on.

        Required on this route: the URI carries no item in the path, so nothing else identifies the resource. This is also the only way to address an item that is literally `.` or `..`, as browsers remove such a path segment while they resolve a URL.
      schema:
        type: string
      required: true
      example: "."
