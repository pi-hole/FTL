openapi: 3.0.2
components:
  paths:
    status:
      get:
        summary: Get the state of this Pi-hole's cluster
        tags:
          - "Cluster"
        operationId: "get_cluster_status"
        description: |
          Returns this node's identity and its view of every configured peer.
          The other nodes of a cluster poll exactly this endpoint, which is why
          it also carries the fingerprints and timestamps they compare to decide
          which of them has to catch the other up.
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'cluster.yaml#/components/schemas/status'
                    - $ref: 'common.yaml#/components/schemas/took'
          '401':
            description: Unauthorized
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'common.yaml#/components/errors/unauthorized'
                    - $ref: 'common.yaml#/components/schemas/took'
    leases:
      get:
        summary: The DHCP leases of this node
        tags:
          - "Cluster"
        operationId: "get_cluster_leases"
        description: |
          The lease file as it is on disk, verbatim. Only the node handing out
          addresses has anything worth reading here; its peers keep a copy so
          that whichever of them takes DHCP over knows which client holds which
          address, and the clients keep the addresses they already have.

          Signed like every other answer between nodes when a peer asks. It is
          not confined to peers, though: any authenticated session may read it,
          the same as the lease list everywhere else in the API.
        responses:
          '200':
            description: OK
            content:
              application/octet-stream:
                schema:
                  type: string
                  format: binary
          '404':
            description: This node has no DHCP leases
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'common.yaml#/components/errors/not_found'
                    - $ref: 'common.yaml#/components/schemas/took'

    lists:
      get:
        summary: Get the list tables of this node
        tags:
          - "Cluster"
        operationId: "get_cluster_lists"
        description: |
          The groups, clients, adlists and domain lists of this node as a ZIP
          archive holding a reduced gravity database - the same shape a
          Teleporter archive carries them in, without the configuration file
          that archive also holds.
        responses:
          '200':
            description: OK
            content:
              application/zip:
                schema:
                  type: string
                  format: binary
          '401':
            description: Unauthorized
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'common.yaml#/components/errors/unauthorized'
                    - $ref: 'common.yaml#/components/schemas/took'
    discover:
      get:
        summary: Find other Pi-holes on the local network
        tags:
          - "Cluster"
        operationId: "get_cluster_discover"
        description: |
          Asks the local network segment which other Pi-holes are there and
          waits a moment for the answers. Only nodes that have clustering
          enabled answer, and they answer with nothing but the port they speak
          HTTPS on - the address is the one the answer came from.

          Joining still needs the password of the node that is picked, so this
          is a convenience rather than a way in.
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  allOf:
                    - type: object
                      properties:
                        nodes:
                          type: array
                          items:
                            type: object
                            properties:
                              address:
                                type: string
                                example: "192.168.0.6"
                              port:
                                type: integer
                                description: The port that node speaks HTTPS on, zero if it has none
                                example: 443
                              url:
                                type: string
                                nullable: true
                                description: |
                                  The URL this node would be joined through, or
                                  null when that node has no encrypted port
                                example: "https://192.168.0.6:443"
                    - $ref: 'common.yaml#/components/schemas/took'
          '401':
            description: Unauthorized
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'common.yaml#/components/errors/unauthorized'
                    - $ref: 'common.yaml#/components/schemas/took'
    enroll:
      post:
        summary: Take another Pi-hole into this cluster
        tags:
          - "Cluster"
        operationId: "post_cluster_enroll"
        description: |
          Adds the given node to this node's member list and hands it the shared
          secret. The member list is an ordinary synchronized setting, so the
          rest of the cluster learns about the new node by itself.

          The caller has proven it knows this Pi-hole's password, which is the
          stronger of the two credentials. Refused unless the connection is
          encrypted, and refused for application passwords, for the CLI password
          and for the other nodes of the cluster: those exist so a script can
          read data, not so it can take a cluster over.

          This is what `POST /api/cluster/join` calls on the node it was pointed
          at - it is not normally called by hand.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                description: |
                  One of the two is needed. `port` is what a joining node
                  normally sends: the address is taken from the connection,
                  which demonstrably reaches it, and the port is the one thing
                  that connection cannot say. A node behind a port forward knows
                  better and sends `self` instead, which is then used as it is.
                properties:
                  self:
                    type: string
                    description: |
                      The whole URL the joining node is reached at, scheme
                      included. Overrides the address this request came from.
                    example: "https://192.168.0.6"
                  port:
                    type: integer
                    minimum: 1
                    maximum: 65535
                    description: |
                      The port the joining node serves HTTPS on, combined with
                      the address this request came from.
                    example: 443
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  allOf:
                    - type: object
                      properties:
                        secret:
                          type: string
                          example: "aGVsbG8gd29ybGQgdGhpcyBpcyBhIHNlY3JldA=="
                        members:
                          type: array
                          items:
                            type: string
                          example: ["https://192.168.0.5", "https://192.168.0.6"]
                    - $ref: 'common.yaml#/components/schemas/took'
          '400':
            description: The node could not be enrolled
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'common.yaml#/components/errors/bad_request'
                    - $ref: 'common.yaml#/components/schemas/took'
          '403':
            description: Forbidden
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'cluster.yaml#/components/errors/forbidden'
                    - $ref: 'common.yaml#/components/schemas/took'
    join:
      post:
        summary: Join the cluster of another Pi-hole
        tags:
          - "Cluster"
        operationId: "post_cluster_join"
        description: |
          Logs in to the given node with the password supplied and asks it to
          enroll this one. What comes back is the cluster secret and the member
          list, now naming this node as well. Clustering is switched on and FTL
          restarts afterwards.

          The configuration and the lists then come from the cluster: this node
          arrives as one nobody has configured yet, so its own settings are
          replaced rather than pushed to the others.

          The connection to the other node has to be an encrypted one, as the
          password and the secret both cross it.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                  - password
                properties:
                  url:
                    type: string
                    description: A node that is already in the cluster
                    example: "https://192.168.0.5"
                  password:
                    type: string
                    description: The web interface password of that node
                    example: "correct horse battery staple"
                  totp:
                    type: string
                    description: |
                      Optional, and needed only where the node being joined has
                      two-factor authentication switched on. Without it that
                      node answers the password on its own with no session at
                      all, and the refusal cannot say which of the two was
                      missing.
                    example: "123456"
                  self:
                    type: string
                    description: |
                      Optional. How the other nodes reach this one, which is
                      what goes into the member list - so it has to be an
                      address they can resolve rather than a loopback one.
                      Left out, the node that is joined uses the address this
                      request arrives from.
                    example: "https://192.168.0.6"
                  pin:
                    type: string
                    description: |
                      Optional. The certificate pin of the node being joined,
                      read off its own status. This is the one connection a
                      cluster cannot authenticate for itself - the joining node
                      holds no shared secret yet - so passing it here is what
                      keeps the password from being readable by anybody on the
                      path.
                    example: "aKG1khSEO0G+KcSunqhLo3cVFCTGSH81QfvtIH8h13s="
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  allOf:
                    - type: object
                      properties:
                        joined:
                          type: boolean
                          example: true
                    - $ref: 'common.yaml#/components/schemas/took'
          '400':
            description: The other node could not be joined
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'common.yaml#/components/errors/bad_request'
                    - $ref: 'common.yaml#/components/schemas/took'
          '403':
            description: Forbidden
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'cluster.yaml#/components/errors/forbidden'
                    - $ref: 'common.yaml#/components/schemas/took'

    leave:
      post:
        summary: Leave the cluster
        tags:
          - "Cluster"
        operationId: "post_cluster_leave"
        description: |
          Takes this node out of the cluster. The other nodes are handed the
          member list without this one first, so they stop polling an address
          that is about to stop answering, and clustering is switched off here
          only afterwards. FTL restarts at the end of it - unless clustering
          was switched on here but never started, in which case there is
          nobody to tell and nothing to restart, and `restarting` says so.

          The shared secret is left in place, so the node can be taken back in
          later without copying it again.
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  allOf:
                    - type: object
                      properties:
                        leaving:
                          type: boolean
                          example: true
                        peers_told:
                          type: boolean
                          description: |
                            Present, and `false`, only where clustering was
                            switched on here but never started: the member list
                            is still there and every node on it still lists this
                            one, so they have to be edited by hand. Absent
                            otherwise - the cluster thread tells them a round
                            from now, and the log records how many it reached.
                          example: false
                        restarting:
                          type: boolean
                          description: |
                            Whether FTL restarts here as part of leaving. It
                            does whenever clustering was running; on a node
                            where it was switched on but never started there is
                            nothing to stop, so the setting is written and no
                            restart follows.
                          example: true
                    - $ref: 'common.yaml#/components/schemas/took'
          '400':
            description: This Pi-hole is not part of a cluster
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'common.yaml#/components/errors/bad_request'
                    - $ref: 'common.yaml#/components/schemas/took'
          '403':
            description: |
              Refused. Leaving needs a session made with the web interface
              password - an application password, the command line and a peer
              are all turned away - and it cannot be done at all while the
              configuration is read-only or `cluster.enabled` is pinned through
              the environment.
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: 'cluster.yaml#/components/errors/forbidden'
                    - $ref: 'common.yaml#/components/schemas/took'

  errors:
    forbidden:
      description: |
        The request was valid, but the server is refusing it.
      type: object
      properties:
        error:
          type: object
          properties:
            key:
              type: string
              description: "Machine-readable error type"
              example: "forbidden"
            message:
              type: string
              description: "Human-readable error message"
              example: "This needs an encrypted connection"
            hint:
              type: string
              nullable: true
              example: null

  schemas:
    status:
      type: object
      properties:
        cluster:
          type: object
          properties:
            enabled:
              type: boolean
              description: Is this Pi-hole part of a cluster?
              example: true
            running:
              type: boolean
              description: |
                Is clustering actually running here? `enabled` is what the
                administrator asked for; this is what FTL was able to do with
                it. It is `false` when clustering is switched on but could not
                be started - with an empty member list, or without a readable
                shared secret - in which case this node keeps no configuration
                in step, answers no peer and elects nobody.
              example: true
            leader:
              type: string
              description: |
                The reachable node with the lowest identity. It anchors the
                virtual IP address when DHCP failover does not; it does not
                decide what the cluster's configuration is - every node may
                publish a change, and the newest one wins.
              example: "pi-hole-1"
            dhcp_owner:
              type: string
              description: |
                Name of the node handing out leases, or - during a hand-over
                with DHCP failover on - of the node elected to take them over.
                Empty when no node serves DHCP. With failover off everywhere it
                simply names the node running an ordinary DHCP server, and
                nothing moves.
              example: "pi-hole-1"
            last_round:
              type: number
              nullable: true
              description: Unix timestamp of the last completed round
              example: 1735689600.0
            node:
              $ref: 'cluster.yaml#/components/schemas/node'
            peers:
              type: array
              items:
                $ref: 'cluster.yaml#/components/schemas/peer'
    node:
      type: object
      description: This node, as the peers see it
      properties:
        name:
          type: string
          example: "pi-hole-1"
        id:
          type: string
          description: |
            Identity of this node, generated once and kept in
            /etc/pihole/cluster.state. Names can collide - two Pi-holes imaged
            from the same card are both called "raspberrypi" - so this is what
            the nodes compare when an election has to pick one of two.
          example: "aB3dEf7hJ9kLmN2p"
        pin:
          type: string
          description: |
            What a peer's TLS connection to this node has to present: the
            base64 SHA-256 of the certificate's public key. Published here
            rather than distributed - this answer is signed with the shared
            secret, so a certificate is authenticated by what authenticates
            everything else.
          example: "aKG1khSEO0G+KcSunqhLo3cVFCTGSH81QfvtIH8h13s="
          nullable: true
        run:
          type: string
          description: |
            A token this run of FTL made up for itself. Two members that answer
            with the same identity are one node listed twice when they answer
            with the same token, and two machines carrying the same
            /etc/pihole/cluster.state when they do not. The certificate cannot
            answer that question - it lives in /etc/pihole beside the identity,
            so every route that clones a node copies both.
          example: "9f2c1ab7e04d5386a1bc77e2d0934f15"
        version:
          type: string
          example: "v6.5"
        branch:
          type: string
          description: |
            The branch this FTL was built from, present only when that is not
            `master`. A cluster of stock Pi-holes has nothing to say here; one
            with a node built from a branch has all the more.
          example: "development"
        time:
          type: number
          description: What time this node thinks it is, as a Unix timestamp
          example: 1735689600.5
        interval:
          type: number
          description: |
            How often this node polls its peers, in seconds. Published so that a
            reader can tell how old the facts this node reports about the other
            members are allowed to be.
          example: 10
        resolving:
          type: boolean
          description: |
            Whether this node answers DNS at all. A dnsmasq that did not start
            leaves FTL up and the cluster thread running, so without this the
            peers see a node that is reachable, healthy and eligible to anchor
            the address its clients resolve at - and elect it.
          example: true
        vip_capable:
          type: boolean
          description: |
            Whether this node would answer on an address the cluster places on
            it. Needs CAP_NET_ADMIN, an interface that exists, and a listening
            mode other than `bind`.
          example: true
        identity_shared:
          type: boolean
          description: |
            Whether another machine is answering with this node's identity,
            which happens when /etc/pihole/cluster.state was copied along with
            the rest of a disk image. Both machines then stand down from DHCP
            and the virtual address until one of them is given a new identity.
          example: false
        dhcp:
          type: object
          properties:
            active:
              type: boolean
              description: Is this node currently serving DHCP?
              example: false
            failover:
              type: boolean
              description: Does this node take part in DHCP failover?
              example: false
            capable:
              type: boolean
              description: |
                Whether this node could start a DHCP server at this moment. It
                is `configured` minus the passing reasons not to: a rebuild of
                the lists in progress, and the wait a failed takeover leaves
                behind. A node that could not is never elected to serve.
              example: false
            configured:
              type: boolean
              description: |
                Is this node set up to serve DHCP at all - a range it could hand
                out, a configuration it may write, nothing pinning `dhcp.active`
                where the cluster cannot move it? `capable` is this minus the
                wait a failed takeover leaves behind, so a node that answers
                `capable: false` with `configured: true` is one that will pick
                DHCP up again shortly, and one that answers false to both never
                will. A node leaving the cluster needs that difference to know
                whether handing DHCP over leaves anybody holding it.
              example: true
            leases:
              type: string
              description: |
                Fingerprint of this node's DHCP lease file. Only the node
                handing out addresses writes that file; the others keep a copy
                and compare it against this, so whichever of them takes over
                already knows which client holds which address. Absent on a
                node whose lease file cannot be read.
              example: "3fa2b1c7080bbad1"
        vip:
          type: object
          properties:
            address:
              type: string
              description: Configured virtual IP address, empty if none
              example: ""
            held:
              type: boolean
              description: Does this node currently hold the virtual IP address?
              example: false
        sync:
          $ref: 'cluster.yaml#/components/schemas/sync_state'
    peer:
      type: object
      properties:
        url:
          type: string
          example: "https://192.168.0.5"
        name:
          type: string
          example: "pi-hole-2"
        id:
          type: string
          example: "qR5tUv8wX1yZ3aB4"
        version:
          type: string
          example: "v6.5"
        reachable:
          type: boolean
          example: true
        self:
          type: boolean
          description: |
            Whether this member turned out to be the node answering. The member
            list is the same on every node, so exactly one entry is.
          example: false
        address:
          type: string
          description: |
            Where this member was last reached. Learned from the connection
            rather than configured, so the name in the member list is resolved
            once instead of every time a connection has to be built again, and
            a node that cannot resolve it at all can be told this address by
            another node. Empty until the member has answered once.
          example: "192.168.0.5"
        branch:
          type: string
          description: |
            The branch this member's FTL was built from, empty when that is
            `master`. A cluster of released Pi-holes says nothing here.
          example: ""
        run:
          type: string
          description: |
            The token this member's running FTL made up for itself. Two members
            answering with the same identity are one Pi-hole listed twice when
            they answer with the same token, and two machines carrying one
            /etc/pihole/cluster.state when they do not - and a third node is
            where a pair that cannot poll each other is visible at all.
          example: "9f2c1ab7e04d5386a1bc77e2d0934f15"
        identity_shared:
          type: boolean
          description: |
            Whether this member reports that another machine is answering with
            its identity. Such a node takes no part in DHCP or the virtual
            address, which from the outside looks like a healthy member with
            nothing to do.
          example: false
        sees:
          type: array
          maxItems: 8
          description: |
            The member addresses this member reports as reachable. Every node
            polls every other one, so reachability is a matrix rather than a
            list - this is the row this member published, and it is empty for a
            member that did not answer. Addresses rather than identities,
            because an identity is only known from a successful poll and is
            forgotten after a few missed rounds, while the member list is the
            same document on every node.
          items:
            type: string
          example: ["https://192.168.0.6"]
        knows_us:
          type: boolean
          description: |
            Whether this member lists the node answering among its own members.
            Configuration and lists travel from whoever holds the newer document
            to the nodes behind it, so a member that does not know this node
            never sends it anything, however healthy it looks.
          example: true
        clock:
          type: object
          description: |
            Which of two changes is the newer one is decided by the clock, so
            the nodes check that they agree on what time it is. A node whose
            clock is too far from ours is not synchronized with.
          properties:
            agrees:
              type: boolean
              example: true
            offset:
              type: number
              description: How far the peer's clock is from ours, in seconds
              example: 0.02
        last_seen:
          type: number
          nullable: true
          description: Unix timestamp of the last successful contact
          example: 1735689600.0
        error:
          type: string
          nullable: true
          description: Why the last contact failed, null if it did not
          example: null
        resolving:
          type: boolean
          description: |
            Whether this peer answers DNS. A node whose dnsmasq did not start is
            reachable and healthy from the outside, and would otherwise be
            elected to anchor the address its clients resolve at.
          example: true
        vip_capable:
          type: boolean
          description: Whether this peer would answer on the virtual address
          example: true
        dhcp:
          type: object
          properties:
            active:
              type: boolean
              example: false
            failover:
              type: boolean
              example: false
            capable:
              type: boolean
              description: |
                Whether this node could start a DHCP server right now. A node
                that could not is never elected to serve.
              example: false
            configured:
              type: boolean
              description: |
                Whether this node has a usable DHCP configuration at all, as
                opposed to being able to serve just now. A node leaving the
                cluster needs the difference: it says whether handing DHCP over
                leaves anybody holding it.
              example: false
        vip:
          type: object
          properties:
            held:
              type: boolean
              example: false
        sync:
          $ref: 'cluster.yaml#/components/schemas/sync_state'
    sync_state:
      type: object
      description: |
        What the node holds, and since when. A peer compares the fingerprints
        against its own to see whether the two are apart at all, and the
        timestamps say which of them holds what the other should take.
      properties:
        config:
          type: object
          properties:
            changed:
              type: number
              description: |
                When somebody last configured this node, as a Unix timestamp.

                Two values are not moments. Zero means nobody has configured this
                node, which is what keeps a fresh one from overwriting the cluster
                it joins. One means the node offered what it holds as the
                cluster's starting point, because no member had a version at all -
                a cluster built entirely from the command line reaches that state
                without anybody changing anything. Both sort below every real
                change on purpose, so a node that was away while the others
                decided still wins with whatever it actually holds. Anything below
                1000000000 is one of these rather than a time.
              example: 1735689600.5
            hash:
              type: string
              description: |
                Fingerprint of everything that travels between the nodes
                unconditionally. Computed over the same set of items on every
                node, so two nodes holding the same configuration always agree.
                What may not decide that set is anything a single node settles
                for itself - whether an item is pinned through the environment,
                or whether this node accepts credentials - because two nodes
                hashing different sets never agree however identical they are.
                An item pinned through the environment is therefore covered like
                any other; if its value differs from the cluster's, the nodes
                differ, which is the truth.
              example: "75f2b4c7080bbad1"
            credentials:
              type: string
              description: |
                Fingerprint of the credentials on their own, which are not part
                of `hash`. Whether they travel between two particular nodes
                depends on what each of them accepts, so a single fingerprint
                covering them would have two nodes compare values that can never
                converge and report a difference that never resolves.
              example: "1cd1749329f8b359"
            accepts_credentials:
              type: boolean
              description: |
                Whether this node takes credentials from the cluster. Comparing
                `credentials` is only meaningful where both nodes do.
              example: true
            wants_credentials:
              type: boolean
              description: |
                Whether this node is set to synchronize credentials, which is not
                the same as doing it: they travel only while every member is an
                `https://` one. The two differing is the whole answer to why the
                passwords are not the same yet.
              example: true
            pinned_credentials:
              type: string
              description: |
                The same, for the items covered by `credentials` rather than by
                `hash` - `webserver.api.pwhash` when the password is given as an
                environment variable, which is what the Docker image does. Kept
                apart because the two fingerprints are compared apart, and an
                item named beside the wrong one explains a difference it has no
                part in.
              example: "webserver.api.pwhash"
            pinned:
              type: string
              description: |
                The settings this node pins through the environment, comma
                separated, empty on a node that pins none. They are covered by
                `hash` like any other setting but no push can move them, so two
                nodes differing only here differ for good - naming them is what
                turns that from an unexplained mismatch into something to act
                on. Credentials are not here: they are fingerprinted apart from
                the rest and listed in `pinned_credentials`. Truncated with
                `...` when there are too many to fit.
              example: "dns.upstreams, webserver.api.pwhash"
        gravity:
          type: object
          properties:
            changed:
              type: number
              description: |
                When the lists last changed, as a Unix timestamp. Zero and one
                are not moments - see `config.changed` above for what they mean.
              example: 1735689600.5
            hash:
              type: string
              example: "f77f8a2bcd508924"
            owed:
              type: boolean
              description: |
                This node holds lists it has not rebuilt from. Usually those
                came from a peer, in which case `hash` cannot say so - it names
                the tables on disk, and those are the peer's, so a node whose
                `pihole -g` keeps failing would otherwise read as fully in step
                while its blocking database is stale. It is also set for a list
                edited here while FTL was not running, and for as long as a
                rebuild is actually running.
              example: false
